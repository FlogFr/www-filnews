{% load filnews_tags %}
{% if tags %}
<ul class="tag-list" aria-label="{{ label|default:'Tags' }}">
  {% for tag in tags %}
  {% if tag|has_tag_page %}
  <li><a class="tag" href="{% url 'tag_detail' tag.slug %}" data-timeline="{% url 'tag_timeline' tag.slug %}">{{ tag.name }}</a></li>
  {% else %}
  {# A tag seen once has no page: plain text. #}
  <li><span class="tag tag--plain">{{ tag.name }}</span></li>
  {% endif %}
  {% endfor %}
</ul>
{% endif %}
