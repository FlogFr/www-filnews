# Nightly content update: ingest the last 24 hours of r/france, analyze the new
# news, commit data/news on main, then publish the static site on `pages`.
# Free: the repository is public (unlimited Actions minutes on hosted runners).
name: Nightly news update

on:
  schedule:
    # 04:47 Paris time all year round (DST handled by `timezone`). Off the
    # top of the hour, when GitHub's scheduler is the most loaded. GitHub
    # treats schedules as best effort: a run can start late (or be dropped).
    - cron: "47 4 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT || 'web:fr.filnews:v1.0 (by /u/filnews)' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Thumbnails are not versioned on main: restore them from the last
      # published site, otherwise the new build would drop them.
      - name: Restore thumbnails from the pages branch
        run: |
          if git fetch --depth=1 origin pages:pages; then
            git archive pages media | tar -x -C data
          fi

      - name: Ingest the last 24 hours
        run: python manage.py ingest_news --period day

      - name: Analyze new news
        run: python manage.py analyze_news

      - name: Commit data on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news
          if ! git diff --cached --quiet; then
            git commit -m "Update news ($(date -u +%F))"
            git push origin HEAD:main
          fi

      - name: Build and publish on pages
        run: python manage.py publish_pages --push
