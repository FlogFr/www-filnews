server {
    listen 8000;
    listen [::]:8000;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;
    # Redirects (e.g. /tags/x -> /tags/x/) stay relative: the container is
    # usually behind a TLS-terminating proxy.
    absolute_redirect off;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/css application/javascript application/rss+xml application/xml
               image/svg+xml text/plain;

    error_page 404 /404.html;

    # Fingerprinted assets (ManifestStaticFilesStorage): cache forever.
    location /static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /media/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location = /rss.xml {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=600" always;
        types { }
        default_type "application/rss+xml; charset=utf-8";
    }

    # Archives used to be paginated (/archives/page/N/): now split by month.
    location ^~ /archives/page/ {
        return 301 /archives/;
    }

    # The Reddit OAuth flow only exists in the local dev server.
    location /auth/ {
        return 404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/ =404;
    }
}
