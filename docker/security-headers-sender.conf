# Only for the pages embedding a Sender.net form (/newsletter/, /contact/):
# Sender's script, the styles it injects (hence 'unsafe-inline' for styles),
# its API, images, an iframe if any and the form submission. Every other page
# keeps the strict policy of security-headers.conf.
include /etc/nginx/snippets/security-headers-base.conf;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.sender.net; style-src 'self' 'unsafe-inline' https://*.sender.net; script-src 'self' https://*.sender.net; font-src 'self' data: https://*.sender.net; connect-src 'self' https://*.sender.net; frame-src https://*.sender.net; object-src 'none'; base-uri 'self'; form-action 'self' https://*.sender.net; frame-ancestors 'none'" always;
