# Only for the pages embedding a Sender.net form (/newsletter/, /contact/).
# Sender renders its forms in about:blank iframes, which inherit this policy:
# - script-src: Sender's scripts, the inline validation script Sender writes
#   into the iframe ('unsafe-inline') and reCAPTCHA (www.google.com loads
#   its code from www.gstatic.com);
# - style-src: styles Sender injects inline;
# - connect-src: Sender's API (d38rqs2egh08o4.cloudfront.net: visits and
#   subscriptions; stats.sender.net);
# - frame-src: reCAPTCHA's iframe.
# Google Fonts (Roboto, requested by Sender's form) stay blocked: the form
# uses the site's self-hosted fonts (css/sender-frame.css).
# Every other page keeps the strict policy of security-headers.conf.
include /etc/nginx/snippets/security-headers-base.conf;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.sender.net https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://*.sender.net; script-src 'self' 'unsafe-inline' https://*.sender.net https://www.google.com https://www.gstatic.com; font-src 'self' data:; connect-src 'self' https://*.sender.net https://d38rqs2egh08o4.cloudfront.net https://www.google.com; frame-src https://*.sender.net https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://*.sender.net; frame-ancestors 'none'" always;
